<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hästprofil – Stall Zeb Jonasson</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--black:#0a0a0c;--navy:#0d1b2e;--white:#f4f2ee;--dim:rgba(244,242,238,.6);--accent:#c8d8e8}*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--white);font-family:'Barlow Condensed',sans-serif}nav{height:82px;padding:1.1rem 4rem;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,12,.96);position:fixed;inset:0 0 auto;z-index:10;border-bottom:1px solid rgba(244,242,238,.06)}nav img{height:48px}.links{display:flex;gap:2.2rem}.links a{color:var(--dim);text-decoration:none;text-transform:uppercase;letter-spacing:.18em;font-size:.78rem}.hero{padding-top:82px;min-height:610px;display:grid;grid-template-columns:45% 55%}.copy{padding:5rem 4rem;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--black))}.eyebrow,.label{font-size:.68rem;font-weight:500;letter-spacing:.23em;text-transform:uppercase;color:var(--accent)}h1{font:300 clamp(3.5rem,7vw,6.5rem)/.9 'Cormorant Garamond';margin:.8rem 0 1rem}.sub{color:var(--dim);letter-spacing:.15em;text-transform:uppercase}.photo{position:relative;overflow:hidden;min-height:528px}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--black),transparent 24%)}main{max-width:1100px;margin:auto;padding:4rem 4rem 8rem}.back{color:var(--dim);text-decoration:none;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}.info{display:grid;grid-template-columns:1fr 1fr;gap:6rem;margin-top:3rem}.block h2{font:300 2.3rem 'Cormorant Garamond';margin:0 0 1.5rem}.rows{border-top:1px solid rgba(244,242,238,.1)}.row{display:grid;grid-template-columns:130px 1fr;gap:1rem;padding:1rem 0;border-bottom:1px solid rgba(244,242,238,.1)}.value{font:300 1.05rem 'Cormorant Garamond'}.trav{display:inline-block;margin-top:2rem;padding:.9rem 1.2rem;border:1px solid rgba(200,216,232,.35);color:var(--white);text-decoration:none;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}.error{padding:12rem 2rem;text-align:center}@media(max-width:900px){nav{padding:1rem 1.5rem}.links{display:none}.hero{grid-template-columns:1fr;min-height:0}.copy{padding:4rem 1.5rem 2.5rem}.photo{height:360px;min-height:360px}.photo:after{background:linear-gradient(0deg,var(--black),transparent 25%)}main{padding:2.5rem 1.5rem 6rem}.info{grid-template-columns:1fr;gap:3rem}}.profile-toggle{display:none;background:none;color:var(--white);border:1px solid var(--dim);padding:8px 12px}@media(max-width:900px){.profile-toggle{display:block}.links.open{display:flex;position:fixed;top:82px;left:0;right:0;background:var(--black);padding:24px;flex-direction:column;gap:20px}}.mobile-horse-label,.mobile-horse-sale{display:none}@media(max-width:900px){.desktop-horse-label{display:none}.mobile-horse-label,.mobile-horse-sale{display:inline}}.links.open{max-height:calc(100dvh - 82px);overflow-y:auto}</style></head><body><nav><a href="/"><img src="/logo-zeb.png" alt="Stall Zeb Jonasson"></a><div class="links"><a href="/nyheter">Nyheter</a><a href="/startkommentarer">Startkommentarer</a><a href="/hastar">Hästar</a><a href="/anlaggning">Anläggning</a><a href="/om-tranaren">Om tränaren</a><a href="/personal">Personal</a><a href="/kontakt">Kontakt</a></div><button class="profile-toggle" type="button" aria-expanded="false" aria-label="Meny">Meny</button></nav><div id="page"><section class="hero"><div class="copy"><div class="eyebrow">Stall Zeb Jonasson</div><h1 id="name">Hästprofil</h1><div class="sub" id="sub"></div></div><div class="photo" id="photo"></div></section><main><a class="back" href="/hastar">← Alla hästar</a><div class="info"><section class="block"><h2>Om hästen</h2><div class="rows" id="horseInfo"></div><a class="trav" id="trav" target="_blank" rel="noopener">Se hos Svensk Travsport →</a></section><section class="block"><h2>Stall & ägare</h2><div class="rows" id="stableInfo"></div></section></div></main></div><script>const esc=s=>String(s||'–').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const parts=location.pathname.split('/').filter(Boolean);const slug=parts[0]==='hastar'&&parts[1]?decodeURIComponent(parts[1]):new URLSearchParams(location.search).get('slug');const row=(l,v)=>`<div class="row"><span class="label">${esc(l)}</span><span class="value">${esc(v)}</span></div>`;fetch('/data/hastar-alla.json?t='+Date.now()).then(r=>r.json()).then(d=>{const h=(d.hastar||[]).find(x=>x.slug===slug||(x.aliases||[]).includes(slug));if(!h)throw new Error('notfound');document.title=h.namn+' – Stall Zeb Jonasson';document.getElementById('name').textContent=h.namn;document.getElementById('sub').textContent=[h.alder,h.kon].filter(Boolean).join(' · ');document.getElementById('photo').innerHTML=h.bild?`<img ${window.publicImages.html(h.bild,{sizes:'(max-width: 900px) 100vw, 55vw',eager:true})} alt="${esc(h.namn)}">`:'';document.getElementById('horseInfo').innerHTML=row('Ålder & kön',[h.alder,h.kon].filter(Boolean).join(' · '))+row('Far',h.far)+row('Mor',h.mor);document.getElementById('stableInfo').innerHTML=row('Ägare',h.agare)+row('Uppfödare',h.uppfodare)+row('Skötare',h.skotare)+(h.status==='archived'?row('Status','Lämnat stallet'):row('Tränare','Zeb Jonasson'));const a=document.getElementById('trav');if(h.travsport)a.href=h.travsport;else a.style.display='none'}).catch(()=>{document.getElementById('page').innerHTML='<div class="error"><h1>Hästen kunde inte hittas</h1><a class="trav" href="/hastar">Till alla hästar</a></div>'});</script><script>document.querySelector(".profile-toggle").addEventListener("click",function(){const open=document.querySelector(".links").classList.toggle("open");this.setAttribute("aria-expanded",String(open))});</script><script src="/content-data.js"></script></body></html>
