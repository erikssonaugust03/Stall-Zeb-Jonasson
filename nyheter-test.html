<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyheter – designförslag</title><style>
:root{--black:#050607;--navy:#0d1d2d;--blue:#9ec7e6;--text:#f5f7f9;--muted:#aeb8c1}*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--text);font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}
header{height:82px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;background:#050607;position:sticky;top:0;z-index:5}header img{width:145px}.nav{display:flex;gap:28px;font-size:13px;text-transform:uppercase;letter-spacing:.1em}
main{max-width:1280px;margin:auto;padding:90px 4vw}.eyebrow{color:var(--blue);font-size:12px;letter-spacing:.18em;text-transform:uppercase}.top h1{font-size:clamp(42px,6vw,76px);font-weight:300;margin:10px 0 18px}.top p{color:var(--muted);max-width:650px;line-height:1.7;margin-bottom:42px}
.lead{display:grid;grid-template-columns:1.45fr .75fr;min-height:480px;background:var(--navy);overflow:hidden}.lead-img{min-height:480px;background-size:cover;background-position:center 38%}.lead-copy{padding:52px;display:flex;flex-direction:column;justify-content:flex-end}.date{font-size:12px;color:var(--blue);letter-spacing:.12em;text-transform:uppercase}.lead h2{font-size:38px;font-weight:300;line-height:1.08;margin:15px 0}.lead p,.card p{color:#c2cbd2;line-height:1.55}.more{margin-top:18px;color:var(--blue);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.sectionbar{display:flex;justify-content:space-between;align-items:end;margin:72px 0 22px}.sectionbar h2{font-size:32px;font-weight:300;margin:0}.filters{display:flex;gap:8px}.filters button{border:1px solid #263442;background:transparent;color:#ccd5dc;padding:9px 15px;border-radius:20px}.filters .active{background:#dcecf7;color:#07101a;border-color:#dcecf7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#0a0f14;overflow:hidden}.card-img{height:210px;background-size:cover;background-position:center}.card-copy{padding:22px}.card h3{font-size:21px;font-weight:400;line-height:1.2;margin:10px 0}.card p{font-size:14px;margin:0}.card .more{display:block}
@media(max-width:800px){.nav{display:none}main{padding-top:55px}.lead{grid-template-columns:1fr}.lead-img{min-height:330px}.lead-copy{padding:30px}.grid{grid-template-columns:1fr 1fr}.filters{display:none}}@media(max-width:520px){.grid{grid-template-columns:1fr}.lead h2{font-size:30px}}
</style></head><body><header><img src="/logo-zeb.png" alt="Stall Zeb Jonasson"><div class="nav"><a href="/startsida-test.html">Startsida</a><a href="/hastar-test-kompakt.html">Våra hästar</a><a href="#">Starter</a><a href="#">Kontakt</a></div></header><main><div class="top"><div class="eyebrow">Från stallet</div><h1>Nyheter</h1><p>Följ vardagen hos Stall Zeb Jonasson – resultat, träning, hästar och det senaste från verksamheten.</p></div><div id="content"></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=d=>new Intl.DateTimeFormat('sv-SE',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'));
fetch('/data/nyheter.json').then(r=>r.json()).then(d=>{const n=[...(d.nyheter||[])].sort((a,b)=>b.datum.localeCompare(a.datum));const lead=n[0],rest=n.slice(1);document.getElementById('content').innerHTML=`
<a class="lead" href="/nyheter/${encodeURIComponent(lead.slug)}"><div class="lead-img" style="background-image:url('${esc(lead.bild)}')"></div><div class="lead-copy"><div class="date">Senaste nytt · ${fmt(lead.datum)}</div><h2>${esc(lead.titel)}</h2><p>${esc(lead.text.split('\\n')[0])}</p><span class="more">Läs nyheten →</span></div></a>
<div class="sectionbar"><h2>Alla nyheter</h2><div class="filters"><button class="active" data-filter="Alla">Alla</button><button data-filter="Resultat">Resultat</button><button data-filter="Stallnytt">Stallnytt</button><button data-filter="Inför start">Inför start</button></div></div>
<div class="grid" id="newsGrid">${rest.map(x=>`<a class="card" data-category="${esc(x.kategori||'')}" href="/nyheter/${encodeURIComponent(x.slug)}"><div class="card-img" style="background-image:url('${esc(x.bild)}')"></div><div class="card-copy"><div class="date">${fmt(x.datum)}</div><h3>${esc(x.titel)}</h3><p>${esc(x.text.split('\\n')[0].slice(0,120))}${x.text.length>120?'…':''}</p><span class="more">Läs mer →</span></div></a>`).join('')}</div>`;});
</script></body></html>
