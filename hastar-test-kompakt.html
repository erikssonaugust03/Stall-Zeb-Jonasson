<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Våra hästar – kompakt test</title><link rel="stylesheet" href="/style.css"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
body{background:var(--black);color:var(--white)}.test-wrap{max-width:1200px;margin:auto}.horse-page-head{padding:9.5rem 4rem 2.5rem;background:linear-gradient(180deg,var(--navy),var(--black))}.horse-page-head .test-wrap{display:flex;align-items:end;justify-content:space-between;gap:2rem}.eyebrow{font-family:'Barlow Condensed';font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:var(--accent)}h1{font-family:'Cormorant Garamond';font-size:clamp(3.5rem,7vw,6rem);font-weight:300;line-height:.95;margin:.6rem 0 0}.intro{max-width:410px;color:var(--white-dim);font-size:1rem;line-height:1.65}.filters{padding:1.2rem 4rem;border-bottom:1px solid rgba(244,242,238,.08)}.filters .test-wrap{display:flex;gap:.7rem;flex-wrap:wrap}.filter{border:1px solid rgba(244,242,238,.12);background:transparent;color:var(--white-dim);padding:.55rem 1rem;font:500 .72rem 'Barlow Condensed';letter-spacing:.16em;text-transform:uppercase;cursor:pointer}.filter.active{border-color:var(--accent);color:var(--white);background:rgba(200,216,232,.06)}.horses{padding:2.25rem 4rem 5rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.card{position:relative;min-height:285px;overflow:hidden;text-decoration:none;background:var(--navy);color:var(--white)}.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.card:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,8,13,.95),rgba(5,8,13,.08) 70%)}.copy{position:absolute;z-index:2;left:1.2rem;right:1.2rem;bottom:1.05rem}.copy h2{font:300 1.7rem 'Cormorant Garamond';margin:.25rem 0}.meta{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}.ped{font:300 .9rem 'Barlow Condensed';color:var(--white-dim)}.card:hover img{transform:scale(1.025)}.card img{transition:transform .35s}.noimg{position:absolute;inset:0;background:linear-gradient(135deg,var(--navy-mid),var(--navy))}.back{display:inline-block;margin-top:1.4rem;color:var(--white);text-decoration:none;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}@media(max-width:850px){.horse-page-head{padding:9rem 1.5rem 2.5rem}.horse-page-head .test-wrap{display:block}.intro{margin-top:1.5rem}.filters{padding:1rem 1.5rem}.horses{padding:2rem 1.5rem 4rem}.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.card{min-height:260px}}

/* visual polish */
.card{transition:transform .22s ease,box-shadow .22s ease}.card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(0,0,0,.28)}
.card:after{transition:opacity .25s}.card:hover:after{opacity:.88}.copy h2{line-height:1.05}.copy p{margin-bottom:0}.filters button{cursor:pointer;transition:.2s}
</style></head><body><nav><a href="/startsida-test.html" class="nav-logo"><img src="/logo-zeb.png" alt="Stall Zeb Jonasson" style="height:48px;width:auto"></a></nav><header class="horse-page-head"><div class="test-wrap"><div><div class="eyebrow">Stall Zeb Jonasson</div><h1>Våra hästar</h1><a class="back" href="/startsida-test.html">← Till teststartsidan</a></div><p class="intro">Lär känna hästarna i stallet. Öppna en profil för stam, ägare, uppfödare, skötare och vidare information hos Svensk Travsport.</p></div></header><div class="filters"><div class="test-wrap"><button class="filter active" data-f="alla">Alla</button><button class="filter" data-f="sto">Ston</button><button class="filter" data-f="hingst">Hingstar</button><button class="filter" data-f="valack">Valacker</button></div></div><main class="horses"><div class="test-wrap"><div class="grid" id="grid"></div></div></main><script>
let all=[];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(f='alla'){const a=all.filter(h=>f==='alla'||String(h.kon).toLowerCase()===f).sort((a,b)=>a.namn.localeCompare(b.namn,'sv'));document.getElementById('grid').innerHTML=a.map(h=>`<a class="card" href="/hastprofil-test.html?slug=${encodeURIComponent(h.slug)}">${h.bild?`<img src="${esc(h.bild)}" alt="${esc(h.namn)}" style="object-position:${esc(h.bildposition||'center center')}">`:'<div class="noimg"></div>'}<div class="copy"><div class="meta">${esc(h.alder)} · ${esc(h.kon)}</div><h2>${esc(h.namn)}</h2><div class="ped">e. ${esc(h.far)} · u. ${esc(h.mor)}</div></div></a>`).join('')}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.f)});fetch('/data/hastar.json').then(r=>r.json()).then(d=>{all=d.hastar||[];render()});
</script></body></html>
