<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hästprofil – test</title><link rel="stylesheet" href="/style.css"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
body{background:var(--black);color:var(--white)}.hero-horse{margin-top:0;min-height:610px;display:grid;grid-template-columns:45% 55%;background:var(--black)}.hero-copy{padding:9rem 4rem 4rem;display:flex;flex-direction:column;justify-content:end;background:linear-gradient(135deg,#0b0e11,var(--black))}.eyebrow,.label{font:500 .68rem 'Barlow Condensed';letter-spacing:.23em;text-transform:uppercase;color:var(--accent)}h1{font:300 clamp(3.5rem,7vw,6.5rem)/.9 'Cormorant Garamond';margin:.7rem 0 1rem}.sub{color:var(--white-dim);letter-spacing:.15em;text-transform:uppercase}.hero-img{position:relative;overflow:hidden;height:610px;min-height:610px}.hero-img img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}.hero-img:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--black),transparent 24%)}.content{max-width:1200px;margin:auto;padding:4rem}.back{color:var(--white-dim);text-decoration:none;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}.info{display:grid;grid-template-columns:1.1fr .9fr;gap:5rem;margin-top:3rem}.block h2{font:300 2.4rem 'Cormorant Garamond';margin-bottom:1.4rem}.rows{border-top:1px solid rgba(244,242,238,.1)}.row{display:grid;grid-template-columns:130px 1fr;gap:1rem;padding:1rem 0;border-bottom:1px solid rgba(244,242,238,.1)}.value{font:300 1.05rem 'Cormorant Garamond'}.trav{display:inline-block;margin-top:2rem;padding:.8rem 1.1rem;border:1px solid rgba(200,216,232,.35);color:var(--white);text-decoration:none;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}@media(max-width:800px){.hero-horse{grid-template-columns:1fr;min-height:0}.hero-copy{padding:8rem 1.5rem 2.5rem}.hero-img{height:380px;min-height:380px}.hero-img:after{background:linear-gradient(0deg,var(--black),transparent 25%)}.content{padding:2.5rem 1.5rem 4rem}.info{grid-template-columns:1fr;gap:3rem}}
.related{max-width:1180px;margin:0 auto;padding:0 4rem 5rem}.related h2{font-weight:300;font-size:30px}.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.related-card{background:#0a0d10;padding:22px;display:block}.related-card small{color:#9ec7e6;text-transform:uppercase;letter-spacing:.08em}.related-card h3{font-size:19px;font-weight:400;margin:10px 0 0}@media(max-width:700px){.related{padding:0 1.25rem 3rem}.related-grid{grid-template-columns:1fr}}
/* visual polish */
.hero-img:after{content:"";position:absolute;inset:0;box-shadow:inset 0 -90px 90px -90px rgba(0,0,0,.7);pointer-events:none}
.related{padding-top:1rem}.related h2{margin:8px 0 22px}.related-card{position:relative;transition:transform .2s ease,background .2s ease;min-height:120px}.related-card:hover{transform:translateY(-3px);background:#11171c}.related-card:after{content:"→";position:absolute;right:20px;bottom:18px;color:#9ec7e6}.related-card h3{padding-right:30px;line-height:1.25}
</style></head><body><nav><a href="/startsida-test.html" class="nav-logo"><img src="/logo-zeb.png" alt="Stall Zeb Jonasson" style="height:48px;width:auto"></a></nav><section class="hero-horse"><div class="hero-copy"><div class="eyebrow">Stall Zeb Jonasson</div><h1 id="name">Hästprofil</h1><div class="sub" id="sub"></div></div><div class="hero-img" id="photo"></div></section><main class="content"><a class="back" href="/hastar-test.html">← Alla hästar</a><div class="info"><section class="block"><h2>Om hästen</h2><div class="rows" id="horseInfo"></div><a class="trav" id="trav" target="_blank" rel="noopener">Se hos Svensk Travsport →</a></section><section class="block"><h2>Stall & ägare</h2><div class="rows" id="stableInfo"></div></section></div><section class="related" id="relatedNews" hidden><div class="eyebrow">Senaste nytt</div><h2>Nyheter om <span id="relatedName"></span></h2><div class="related-grid" id="relatedGrid"></div></section></main><script>
const esc=s=>String(s||'–').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=new URLSearchParams(location.search).get('slug')||'calgary-dreams';const row=(l,v)=>`<div class="row"><span class="label">${esc(l)}</span><span class="value">${esc(v)}</span></div>`;fetch('/data/hastar.json').then(r=>r.json()).then(d=>{const h=(d.hastar||[]).find(x=>x.slug===slug);if(!h)return;document.title=h.namn+' – test';document.getElementById('name').textContent=h.namn;document.getElementById('sub').textContent=(h.alder||'')+' · '+(h.kon||'');document.getElementById('photo').innerHTML=h.bild?`<img src="${esc(h.bild)}" alt="${esc(h.namn)}" style="object-position:${esc(h.bildposition||'center center')}">`:'';document.getElementById('horseInfo').innerHTML=row('Ålder & kön',(h.alder||'')+' · '+(h.kon||''))+row('Far',h.far)+row('Mor',h.mor);document.getElementById('stableInfo').innerHTML=row('Ägare',h.agare)+row('Uppfödare',h.uppfodare)+row('Skötare',h.skotare)+row('Tränare','Zeb Jonasson');const a=document.getElementById('trav');if(h.travsport)a.href=h.travsport;else a.style.display='none';fetch('/data/nyheter.json').then(r=>r.json()).then(nd=>{const rel=(nd.nyheter||[]).filter(n=>n.hast===h.namn).sort((a,b)=>b.datum.localeCompare(a.datum)).slice(0,3);if(rel.length){document.getElementById('relatedName').textContent=h.namn;document.getElementById('relatedGrid').innerHTML=rel.map(n=>'<a class="related-card" href="/nyheter/'+encodeURIComponent(n.slug)+'"><small>'+esc(n.kategori||'Nyhet')+' · '+esc(n.datum)+'</small><h3>'+esc(n.titel)+'</h3></a>').join('');document.getElementById('relatedNews').hidden=false}});});
</script></body></html>
